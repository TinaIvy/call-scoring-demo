[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "call-scoring-demo"
version = "0.1.0"
description = "Score appointment-setter calls and measure the scorer against human ratings (made-up data)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
llm = ["anthropic"]

[project.scripts]
score-calls = "call_scoring.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]
